name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin zip unzip

      - run: npm ci
      - run: npm run verify
